<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>利率与情绪</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231a4d45'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js"></script>
</head>
<body>
  <div class="wrap">
    <nav class="nav" id="nav" aria-label="页面"></nav>
    <header>
      <h1>利率与情绪</h1>
      <p class="lede">情绪、利率，以及大宗、汇率与加密。涨跌按序列自己算。利率有 FRED 当天收盘时用收盘价画历史、算变动；FRED 还没出的最新一天标「笔记实时价」。灰卡片是沿用。</p>
    </header>
    <p id="status" class="status">正在读取数据…</p>
    <section id="briefing" class="briefing" hidden></section>
    <div id="groups"></div>
    <footer id="footer" hidden></footer>
  </div>
  <script>
    const DIGITS = {
      cnn_fg: 1, aaii: 1, spx_rsi: 1, nasdaq_rsi: 1, vix: 2,
      etf_spx: 2, etf_ndx: 2, btc: 0, gold: 1, wti: 2, copper: 2, usdcny: 4,
      spx_breadth_20: 1, spx_breadth_50: 1, spx_breadth_200: 1,
      ndx_breadth_20: 1, ndx_breadth_50: 1, ndx_breadth_200: 1,
      effr_next: 2, effr_year: 2, effr_ny: 2
    };
    const MOOD = ["cnn_fg", "spx_rsi", "nasdaq_rsi", "aaii", "vix", "etf_spx", "etf_ndx"];
    const BREADTH = [
      ["标普500", ["spx_breadth_20", "spx_breadth_50", "spx_breadth_200"]],
      ["纳斯达克100", ["ndx_breadth_20", "ndx_breadth_50", "ndx_breadth_200"]]
    ];
    const RATES = ["us_10y", "tips_10y", "t10yie", "us_2y", "t10y2y", "hy_oas"];
    const EFFR = ["effr_next", "effr_year", "effr_ny"];
    const OTHER = ["wti", "gold", "copper", "usdcny", "btc"];
    const FRED_FILE = {
      us_10y: "DGS10",
      us_2y: "DGS2",
      tips_10y: "DFII10",
      t10yie: "T10YIE",
      t10y2y: "T10Y2Y",
      hy_oas: "BAMLH0A0HYM2"
    };

    function chipClass(label) {
      if (label === "恐慌") return "chip panic";
      if (label === "贪婪") return "chip greed";
      if (label === "风险") return "chip risk";
      if (label === "机会") return "chip chance";
      return "chip";
    }

    function latestMap(rows) {
      const map = new Map();
      rows.forEach((row) => {
        const prev = map.get(row.series_id);
        if (!prev || row.date > prev.date) map.set(row.series_id, row);
      });
      return map;
    }

    function history(rows, id) {
      const map = new Map();
      seriesRows(rows, id).forEach((row) => {
        const obs = (row.obs_date || row.date || "").slice(0, 10);
        if (obs) map.set(obs, row);
      });
      return [...map.values()].sort((a, b) => (a.obs_date || a.date).localeCompare(b.obs_date || b.date));
    }

    function rateHistory(rows, id, fredMap) {
      return history(rows, id).map((row) => {
        const obs = (row.obs_date || row.date || "").slice(0, 10);
        const fred = fredMap ? num(fredMap[obs]) : null;
        if (fred == null) return row;
        return Object.assign({}, row, { value: String(fred), fred: "1" });
      });
    }

    function addDaysIso(iso, days) {
      const parts = iso.split("-").map(Number);
      const dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2] + days));
      return dt.toISOString().slice(0, 10);
    }

    function yearSpark(notePoints, fredMap) {
      if (!fredMap) return notePoints;
      const days = Object.keys(fredMap).filter((day) => num(fredMap[day]) != null).sort();
      if (!days.length) return notePoints;
      const end = days[days.length - 1];
      const start = addDaysIso(end, -365);
      const points = days.filter((day) => day >= start).map((day) => ({
        obs_date: day,
        value: String(fredMap[day]),
        fred: "1",
      }));
      const latest = notePoints[notePoints.length - 1];
      if (latest) {
        const obs = (latest.obs_date || latest.date || "").slice(0, 10);
        const last = points.length ? points[points.length - 1].obs_date : "";
        if (obs > last) points.push(latest);
      }
      return points.length ? points : notePoints;
    }

    function unitText(row) {
      if (row.series_id === "aaii") return " 个百分点";
      if (row.unit === "百分比" || row.unit === "百分点") return "%";
      return row.unit ? " " + row.unit : "";
    }

    function spark(points) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "spark");
      svg.setAttribute("viewBox", "0 0 120 36");
      svg.setAttribute("aria-hidden", "true");
      const values = points.map((row) => num(row.value)).filter((value) => value != null);
      if (!values.length) return svg;
      const min = Math.min.apply(null, values);
      const max = Math.max.apply(null, values);
      const span = max - min || 1;
      const coords = values.map((value, index) => {
        const x = values.length === 1 ? 60 : (index / (values.length - 1)) * 116 + 2;
        const y = 32 - ((value - min) / span) * 28;
        return x.toFixed(1) + "," + y.toFixed(1);
      });
      const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      line.setAttribute("points", coords.join(" "));
      line.setAttribute("fill", "none");
      line.setAttribute("stroke", "#1a4d45");
      line.setAttribute("stroke-width", "1.6");
      svg.appendChild(line);
      return svg;
    }

    function hintText(row) {
      const remark = row.remark || "";
      if (!remark) return "";
      if (remark.includes("休市") || remark.includes("未更新")) {
        const piece = remark.split("；")[0];
        return piece;
      }
      const rule = remark.match(/风险阈值[^；。]*/);
      if (rule) return rule[0];
      const band = remark.match(/<20机会\/?>?80风险/);
      if (band) return "低于 20 标机会，高于 80 标风险";
      if (remark.includes("划分：")) return remark.slice(remark.indexOf("划分："), remark.indexOf("划分：") + 42);
      return "";
    }

    const KIND = {
      us_10y: "bp", us_2y: "bp", tips_10y: "bp", t10yie: "bp", t10y2y: "bp", hy_oas: "bp",
      effr_next: "bp", effr_year: "bp", effr_ny: "bp",
      etf_spx: "pp", etf_ndx: "pp", aaii: "pp",
      spx_breadth_20: "pp", spx_breadth_50: "pp", spx_breadth_200: "pp",
      ndx_breadth_20: "pp", ndx_breadth_50: "pp", ndx_breadth_200: "pp",
      cnn_fg: "pt", spx_rsi: "pt", nasdaq_rsi: "pt", vix: "pt"
    };

    function displayName(row) {
      if (row.series_id === "btc") return "比特币";
      return row.name || row.series_id;
    }

    function kindOf(id) {
      return KIND[id] || "pct";
    }

    function formatKind(kind, value) {
      if (value == null || !Number.isFinite(value)) return "";
      if (kind === "bp") {
        const whole = Math.abs(value - Math.round(value)) < 0.05;
        const shown = whole ? Math.round(value) : value.toFixed(1);
        return (value > 0 ? "+" : "") + shown + "bp";
      }
      if (kind === "pp") return (value > 0 ? "+" : "") + value.toFixed(2) + " 个百分点";
      if (kind === "pt") return (value > 0 ? "+" : "") + value.toFixed(1) + " 点";
      return (value > 0 ? "+" : "") + value.toFixed(1) + "%";
    }

    function seriesRows(rows, id) {
      return rows.filter((row) => row.series_id === id).sort((a, b) => a.date.localeCompare(b.date));
    }

    function priorRow(rows, id, row) {
      if (row.carried === "1") return null;
      const obs = (row.obs_date || row.date || "").slice(0, 10);
      const items = seriesRows(rows, id);
      for (let i = items.length - 1; i >= 0; i -= 1) {
        const item = items[i];
        if (item === row || item.date > row.date) continue;
        const other = (item.obs_date || item.date || "").slice(0, 10);
        if (other && other !== obs) return item;
      }
      return null;
    }

    function card(row, points, rows, linePoints) {
      const box = el("article", "ind-card" + (row.carried === "1" ? " carried" : ""));
      box.tabIndex = 0;
      box.appendChild(el("p", "label", displayName(row)));
      const digits = DIGITS[row.series_id] == null ? 2 : DIGITS[row.series_id];
      const shown = points.length ? points[points.length - 1] : row;
      const value = el("p", "v", fmt(num(shown.value), digits));
      const suffix = unitText(row);
      if (suffix) value.appendChild(el("span", "unit", suffix));
      box.appendChild(value);
      const meta = el("p", "chg");
      if (row.label) meta.appendChild(el("span", chipClass(row.label), row.label));
      const bits = [];
      const when = row.obs_date || row.date;
      const live = Boolean(FRED_FILE[row.series_id]) && shown.fred !== "1" && row.carried !== "1";
      if (row.carried === "1") {
        bits.push("沿用");
        if (when) bits.push(when);
      } else {
        const prev = points.length >= 2 ? points[points.length - 2] : priorRow(rows, row.series_id, row);
        if (prev) {
          const kind = kindOf(row.series_id);
          const left = num(prev.value);
          const right = num(shown.value);
          let change = null;
          if (left != null && right != null) {
            if (kind === "bp") change = Math.round((right - left) * 10000) / 100;
            else if (kind === "pct") change = left === 0 ? null : (right - left) / Math.abs(left) * 100;
            else change = right - left;
          }
          const text = formatKind(kind, change);
          if (text) bits.push(text);
        }
        if (live) bits.push("笔记实时价");
        if (row.hike_count) bits.push("隐含加息 " + row.hike_count + " 次");
        if (when) bits.push(when);
      }
      if (bits.length) meta.appendChild(document.createTextNode((row.label ? " · " : "") + bits.join(" · ")));
      box.appendChild(meta);
      box.appendChild(spark(linePoints || points));
      const hint = hintText(row);
      if (hint) box.appendChild(el("p", "hint", hint));
      box.addEventListener("click", () => box.classList.toggle("open"));
      return box;
    }

    function paint(parent, ids, map, rows, fredMaps) {
      const grid = el("div", "card-grid");
      ids.forEach((id) => {
        const row = map.get(id);
        if (!row) return;
        const points = FRED_FILE[id] ? rateHistory(rows, id, fredMaps[id]) : history(rows, id);
        const line = FRED_FILE[id] ? yearSpark(points, fredMaps[id]) : points;
        grid.appendChild(card(row, points, rows, line));
      });
      if (grid.childElementCount) parent.appendChild(grid);
    }

    function render(meta, rows, fredMaps) {
      const info = meta.sentiment || {};
      const latestDate = info.history_end || "";
      const map = latestMap(rows);
      const root = $("groups");
      const mood = el("section", "group-block");
      mood.appendChild(el("h2", null, "情绪"));
      paint(mood, MOOD, map, rows, fredMaps);
      mood.appendChild(el("h3", "subhead", "参与度"));
      BREADTH.forEach((pair) => {
        mood.appendChild(el("p", "label", pair[0]));
        paint(mood, pair[1], map, rows, fredMaps);
      });
      root.appendChild(mood);

      const rates = el("section", "group-block");
      rates.appendChild(el("h2", null, "利率"));
      paint(rates, RATES, map, rows, fredMaps);
      rates.appendChild(el("h3", "subhead", "EFFR 路径"));
      paint(rates, EFFR, map, rows, fredMaps);
      root.appendChild(rates);

      const other = el("section", "group-block");
      other.appendChild(el("h2", null, "大宗、汇率与加密"));
      paint(other, OTHER, map, rows, fredMaps);
      root.appendChild(other);

      const footer = $("footer");
      footer.hidden = false;
      footer.appendChild(el("p", null, "历史从 " + (info.history_start || "—") + " 到 " + (info.history_end || "—") + "。旧笔记里没有的指标就留空。标签照笔记原样写。把鼠标放在卡片上，或点一下，可以看阈值和休市说明。只供个人查看，不是投资建议。"));
      $("status").hidden = true;
    }

    async function main() {
      renderNav("sentiment.html");
      try {
        await renderBriefing("sentiment");
        const meta = JSON.parse(await loadText("data/meta.json"));
        const files = (meta.sentiment || {}).files || {};
        const seriesText = await loadText("data/" + (files.series || "sentiment/series.csv"));
        const fredMaps = {};
        await Promise.all(Object.keys(FRED_FILE).map(async (id) => {
          try {
            const text = await loadText("data/series/" + FRED_FILE[id] + ".csv");
            const map = {};
            parseCSV(text).forEach((item) => {
              if (item.date) map[item.date.slice(0, 10)] = item.value;
            });
            fredMaps[id] = map;
          } catch (err) {
            fredMaps[id] = null;
          }
        }));
        render(meta, parseCSV(seriesText), fredMaps);
      } catch (err) {
        const status = $("status");
        status.className = "status error";
        status.textContent = "数据没有读出来。请用本地服务器打开（python3 -m http.server）。" + (err && err.message ? " " + err.message : "");
      }
    }
    main();
  </script>
</body>
</html>
