<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>总览</title>
  <meta name="description" content="宏观看板总览：规则算出的信号、未来七天的高优先级日程、各页摘要和数据健康。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231a4d45'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js"></script>
</head>
<body>
  <div class="wrap">
    <nav class="nav" id="nav" aria-label="页面"></nav>
    <header>
      <h1>总览</h1>
      <p class="lede">信号按写死的阈值从现有数据里算出来，方便先看一眼。点进对应的页可以核对原始数字。这不是结论。</p>
    </header>
    <p id="status" class="status">正在读取数据…</p>
    <h2>信号</h2>
    <div id="signals"></div>
    <h2>未来 7 天 · 高优先级</h2>
    <div id="agenda"></div>
    <h2>各页摘要</h2>
    <div id="pages"></div>
    <h2>数据健康</h2>
    <div id="health"></div>
    <footer>
      <p>只供个人查看，不是投资建议。</p>
    </footer>
  </div>
  <script>
    const PAGES = [
      ["liquidity", "流动性", "liquidity.html"],
      ["sentiment", "利率与情绪", "sentiment.html"],
      ["earnings", "盈利跟踪", "earnings.html"],
      ["semis", "半导体与算力", "semis.html"],
      ["calendar", "日历", "calendar.html"],
    ];

    function renderSignals(data) {
      const root = $("signals");
      root.textContent = "";
      const cols = el("div", "signal-cols");
      ["风险", "机会", "关注"].forEach((name) => {
        const col = el("section");
        const items = (data.signals && data.signals[name]) || [];
        col.appendChild(el("h3", null, name + " · " + items.length));
        if (!items.length) col.appendChild(el("p", "lede", "没有"));
        items.forEach((item) => {
          const card = el("article", "signal-card");
          const title = el("p");
          const link = el("a", null, item.title);
          link.href = item.page;
          title.appendChild(link);
          card.appendChild(title);
          card.appendChild(el("p", null, item.evidence));
          card.appendChild(el("p", "unit", item.threshold));
          col.appendChild(card);
        });
        cols.appendChild(col);
      });
      root.appendChild(cols);
    }

    function renderAgenda(rows) {
      const root = $("agenda");
      root.textContent = "";
      if (!rows.length) {
        root.appendChild(el("p", "lede", "未来 7 天没有优先级为高的条目。"));
        return;
      }
      const list = el("ul", "list");
      rows.forEach((row) => {
        const item = document.createElement("li");
        const link = el("a", null, row.title);
        link.href = "calendar.html";
        item.appendChild(document.createTextNode((row.date || "") + (row.time_bj ? " " + row.time_bj : "") + " "));
        item.appendChild(link);
        list.appendChild(item);
      });
      root.appendChild(list);
    }

    function renderPages(briefing) {
      const root = $("pages");
      root.textContent = "";
      PAGES.forEach((page) => {
        const block = el("section", "group-block");
        const heading = el("h3", null, "");
        const link = el("a", null, page[1]);
        link.href = page[2];
        heading.appendChild(link);
        block.appendChild(heading);
        block.appendChild(el("p", "label", page[0] === "sentiment" ? "笔记原文" : "今日小结"));
        const lines = (briefing.pages && briefing.pages[page[0]]) || ["今日无变动"];
        const list = el("ul", "brief-list");
        lines.forEach((line) => {
          const item = document.createElement("li");
          item.textContent = line;
          list.appendChild(item);
        });
        block.appendChild(list);
        if (page[0] === "sentiment" && briefing.caveat && briefing.caveat.sentiment) {
          block.appendChild(el("p", "unit", briefing.caveat.sentiment));
        }
        root.appendChild(block);
      });
    }

    function renderHealth(rows, freshness) {
      const root = $("health");
      root.textContent = "";
      if (freshness && freshness.length) {
        const wrap = el("div", "table-scroll");
        const table = document.createElement("table");
        const head = document.createElement("thead");
        const hr = document.createElement("tr");
        ["数据", "最新观测日", "距今", "状态"].forEach((label) => {
          const cell = document.createElement("th");
          cell.textContent = label;
          hr.appendChild(cell);
        });
        head.appendChild(hr);
        table.appendChild(head);
        const body = document.createElement("tbody");
        freshness.forEach((row) => {
          const tr = document.createElement("tr");
          const cells = [
            row.name || "",
            row.obs_date || "—",
            row.age_days == null ? "—" : row.age_days + " 天",
            row.status || "",
          ];
          cells.forEach((text, index) => {
            const cell = document.createElement("td");
            cell.textContent = text;
            if (index === 3 && text === "过期") cell.className = "stale";
            tr.appendChild(cell);
          });
          body.appendChild(tr);
        });
        table.appendChild(body);
        wrap.appendChild(table);
        root.appendChild(wrap);
      }
      if (!rows.length) {
        if (!freshness || !freshness.length) root.appendChild(el("p", "lede", "没有需要标出的问题。"));
        return;
      }
      const list = el("ul", "list");
      rows.forEach((row) => {
        const item = document.createElement("li");
        item.textContent = (row.level ? row.level + "：" : "") + row.text;
        list.appendChild(item);
      });
      root.appendChild(list);
    }

    async function main() {
      renderNav("index.html");
      try {
        const signals = JSON.parse(await loadText("data/signals.json"));
        const briefing = JSON.parse(await loadText("data/briefing.json"));
        renderSignals(signals);
        renderAgenda(signals.agenda || []);
        renderPages(briefing);
        renderHealth(signals.health || [], signals.freshness || []);
        $("status").hidden = true;
      } catch (err) {
        const status = $("status");
        status.className = "status error";
        status.textContent = "总览还没有生成。先运行 python3 scripts/build_site.py。" + (err && err.message ? " " + err.message : "");
      }
    }
    main();
  </script>
</body>
</html>
