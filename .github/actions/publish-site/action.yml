name: 发布当前工作区
description: 构建 dist/ 并发布到 GitHub Pages

outputs:
  page_url:
    description: 发布后的网页地址
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - name: 准备 Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: 安装构建依赖
      shell: bash
      run: pip install -r requirements.txt

    - name: 构建静态站点
      shell: bash
      run: python scripts/build_site.py

    - name: 配置 Pages
      uses: actions/configure-pages@v5

    - name: 上传站点
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist

    - name: 部署
      id: deployment
      uses: actions/deploy-pages@v4
