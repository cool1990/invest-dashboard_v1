name: 发布当前工作区
description: 把已经检出的网页和 data 发布到 GitHub Pages

outputs:
  page_url:
    description: 发布后的网页地址
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - name: 组装静态站点
      shell: bash
      run: |
        mkdir -p _site
        cp .nojekyll _site/
        cp *.html _site/
        cp -r assets _site/assets
        cp -r data _site/data

    - name: 配置 Pages
      uses: actions/configure-pages@v5

    - name: 上传站点
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: 部署
      id: deployment
      uses: actions/deploy-pages@v4
