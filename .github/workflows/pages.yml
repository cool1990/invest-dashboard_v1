name: 发布网页

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "assets/**"
      - "data/**"
      - ".nojekyll"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
      - ".github/actions/publish-site/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 发布网页
        id: publish
        uses: ./.github/actions/publish-site
