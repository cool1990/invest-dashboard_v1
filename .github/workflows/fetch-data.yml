name: 更新数据

on:
  schedule:
    # 每天 22:00 UTC，约北京时间次日 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-liquidity-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 从 FRED 拉取并计算
        run: python3 scripts/fetch_liquidity.py

      - name: 把新数据提交到 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "数据没有变化"
            exit 0
          fi
          git commit -m "data: 更新美国流动性序列"
          git push
