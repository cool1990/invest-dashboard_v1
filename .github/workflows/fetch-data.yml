name: 更新数据

on:
  schedule:
    # 每天 22:00 UTC，约北京时间次日 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fetch-liquidity-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 从 FRED 拉取并计算
        # 单条失败也会正常结束：旧 CSV 保留，meta.json 写下 last_fetch_ok。
        # 这样本步之后的提交能把新鲜度记下来。用 GITHUB_TOKEN 推送不会再触发
        # 「发布网页」，所以数据有变化时由下面的 deploy 自己发布。
        run: python3 scripts/fetch_liquidity.py

      - name: 把新数据提交到 main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "数据没有变化"
            exit 0
          fi
          git commit -m "data: 更新美国流动性序列"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: 检出刚提交的数据
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.fetch.outputs.sha }}

      - name: 发布网页
        id: publish
        uses: ./.github/actions/publish-site
