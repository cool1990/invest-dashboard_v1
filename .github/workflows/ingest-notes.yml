name: 收录笔记

on:
  push:
    branches: [main]
    paths:
      - "inbox/notes/**"
      - "inbox/reports/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ingest-notes
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      deploy: ${{ steps.commit.outputs.deploy }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 整理笔记
        run: python3 ingest/parse_notes.py --notes inbox/notes

      - name: 提交整理后的数据
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          deploy=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            deploy=true
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            if git diff --name-only "${{ github.event.before }}" HEAD -- inbox/reports | grep -q .; then
              deploy=true
            fi
          fi
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "数据没有变化"
            exit 0
          fi
          git commit -m "data: 收录早晨笔记"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: ingest
    if: needs.ingest.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: 检出刚提交的数据
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ingest.outputs.sha }}

      - name: 发布网页
        id: publish
        uses: ./.github/actions/publish-site
